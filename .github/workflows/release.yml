name: Auto Release & Publish


on:
  workflow_dispatch:
  pull_request_target:
    types: [ closed ]
    branches:
      - main

permissions:
  contents: write

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.set-skip.outputs.skip }}
    steps:
      - name: Determine if release should be skipped
        id: set-skip
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ "$PR_MERGED" == "true" && "$PR_TITLE" == *"[release]"* ]]; then
            echo "Proceeding with release jobs."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not a merged [release] PR, skipping release jobs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check-skip
    if: ${{ needs.check-skip.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    outputs:
      draft_tag: ${{ steps.release_step.outputs.draft_tag }}
      version: ${{ steps.release_step.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - run: corepack enable

      - run: yarn install --immutable

      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run release-it
        id: release_step
        run: |
          VERSION=$(yarn release-it --ci --release-version)
          echo "$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          OUTPUT=$(yarn release-it --ci)
          echo "$OUTPUT"

          DRAFT_TAG=$(echo "$OUTPUT" | grep -oE 'untagged-[a-z0-9]+')
          echo "draft_tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build-and-publish:
    needs: create-release
    uses: ./.github/workflows/expo.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      ref: ${{ needs.create-release.outputs.version }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  finalize-release:
    needs:
      - create-release
      - build-and-publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DRAFT_TAG: ${{ needs.create-release.outputs.draft_tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./apk

      - name: Attach APK to release
        run: gh release upload "$DRAFT_TAG" "./apk/OpenMailbox-v$VERSION.apk" --clobber

      - name: Publish GitHub Release
        run: gh release edit "$DRAFT_TAG" --draft=false
